# The signed-in account's own list goes by id, never by a name resolved from the cached viewer, which
# can still belong to the account that was active a moment ago. Other people's lists go by name.
query GetUserLibrary($userId: Int, $username: String, $type: MediaType!) {
  MediaListCollection(userId: $userId, userName: $username, type: $type) {
    user {
      id
      mediaListOptions {
        scoreFormat
        animeList { customLists advancedScoring advancedScoringEnabled }
        mangaList { customLists advancedScoring advancedScoringEnabled }
      }
    }
    lists {
      name
      isCustomList
      entries {
        id
        media {
          id
          title {
            userPreferred
            romaji
            english
            native
          }
          coverImage {
            medium
            large
            extraLarge
          }
          episodes
          chapters
          volumes
          type
          format
          status
          genres
          nextAiringEpisode {
            episode
            timeUntilAiring
            airingAt
          }
          startDate {
            year
            month
            day
          }
        }
        status
        progress
        progressVolumes
        score
        advancedScores
        repeat
        notes
        startedAt {
          year
          month
          day
        }
        completedAt {
          year
          month
          day
        }
        priority
        private
        hiddenFromStatusLists
        updatedAt
        createdAt
      }
    }
  }
}
