"""
Single-request universal search: anime, manga and the four entity kinds as aliased Pages in one
round trip. `$wantAnime` / `$wantManga` / `$wantEntities` gate each bucket via @include, so paging
one category fetches only its own bucket. `$wantStudios` gates studios apart from the other three
entities, because the Studios chip lists them before any name is typed. Each media half takes its
own sort, because a length column means episodes on anime and chapters on manga.
"""
query SearchEverything(
  $search: String,
  $page: Int = 1,
  $perPage: Int = 20,
  $wantAnime: Boolean!,
  $wantManga: Boolean!,
  $wantEntities: Boolean!,
  $wantStudios: Boolean!,
  $animeSort: [MediaSort],
  $mangaSort: [MediaSort],
  $genre_in: [String],
  $genre_not_in: [String],
  $tag_in: [String],
  $tag_not_in: [String],
  $format_in: [MediaFormat],
  $status_in: [MediaStatus],
  $source_in: [MediaSource],
  $startDate_greater: FuzzyDateInt,
  $startDate_lesser: FuzzyDateInt,
  $season: MediaSeason,
  $seasonYear: Int,
  $weightedScore: Int,
  $weightedScore_greater: Int,
  $weightedScore_lesser: Int,
  $episodes: Int,
  $episodes_greater: Int,
  $episodes_lesser: Int,
  $chapters: Int,
  $chapters_greater: Int,
  $chapters_lesser: Int,
  $countryOfOrigin: CountryCode,
  $isAdult: Boolean
) {
  anime: Page(page: $page, perPage: $perPage) @include(if: $wantAnime) {
    pageInfo {
      total
      currentPage
      hasNextPage
    }
    media(
      search: $search,
      type: ANIME,
      sort: $animeSort,
      genre_in: $genre_in,
      genre_not_in: $genre_not_in,
      tag_in: $tag_in,
      tag_not_in: $tag_not_in,
      format_in: $format_in,
      status_in: $status_in,
      source_in: $source_in,
      startDate_greater: $startDate_greater,
      startDate_lesser: $startDate_lesser,
      season: $season,
      seasonYear: $seasonYear,
      weightedScore: $weightedScore,
      weightedScore_greater: $weightedScore_greater,
      weightedScore_lesser: $weightedScore_lesser,
      episodes: $episodes,
      episodes_greater: $episodes_greater,
      episodes_lesser: $episodes_lesser,
      chapters: $chapters,
      chapters_greater: $chapters_greater,
      chapters_lesser: $chapters_lesser,
      countryOfOrigin: $countryOfOrigin,
      isAdult: $isAdult
    ) {
      ...MediaCardFields
    }
  }
  manga: Page(page: $page, perPage: $perPage) @include(if: $wantManga) {
    pageInfo {
      total
      currentPage
      hasNextPage
    }
    media(
      search: $search,
      type: MANGA,
      sort: $mangaSort,
      genre_in: $genre_in,
      genre_not_in: $genre_not_in,
      tag_in: $tag_in,
      tag_not_in: $tag_not_in,
      format_in: $format_in,
      status_in: $status_in,
      source_in: $source_in,
      startDate_greater: $startDate_greater,
      startDate_lesser: $startDate_lesser,
      season: $season,
      seasonYear: $seasonYear,
      weightedScore: $weightedScore,
      weightedScore_greater: $weightedScore_greater,
      weightedScore_lesser: $weightedScore_lesser,
      episodes: $episodes,
      episodes_greater: $episodes_greater,
      episodes_lesser: $episodes_lesser,
      chapters: $chapters,
      chapters_greater: $chapters_greater,
      chapters_lesser: $chapters_lesser,
      countryOfOrigin: $countryOfOrigin,
      isAdult: $isAdult
    ) {
      ...MediaCardFields
    }
  }
  characters: Page(page: $page, perPage: $perPage) @include(if: $wantEntities) {
    pageInfo {
      hasNextPage
    }
    characters(search: $search, sort: [FAVOURITES_DESC]) {
      id
      name {
        full
        native
        userPreferred
      }
      image {
        medium
      }
      favourites
    }
  }
  staff: Page(page: $page, perPage: $perPage) @include(if: $wantEntities) {
    pageInfo {
      hasNextPage
    }
    staff(search: $search, sort: [FAVOURITES_DESC]) {
      id
      name {
        full
        native
        userPreferred
      }
      image {
        medium
      }
      primaryOccupations
      favourites
    }
  }
  users: Page(page: $page, perPage: $perPage) @include(if: $wantEntities) {
    pageInfo {
      hasNextPage
    }
    users(search: $search, sort: [SEARCH_MATCH]) {
      id
      name
      avatar {
        medium
      }
    }
  }
  studios: Page(page: $page, perPage: $perPage) @include(if: $wantStudios) {
    pageInfo {
      hasNextPage
    }
    # Without a search there is nothing to match, and the favourites order takes over.
    studios(search: $search, sort: [SEARCH_MATCH, FAVOURITES_DESC]) {
      id
      name
      favourites
    }
  }
}
